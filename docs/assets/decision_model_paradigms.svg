<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">Possible decision model architectures</title>
<desc id="desc">The language model scores next-token probabilities. CLM compares independent state and action vectors. Action tokens form the input sequence of a Transformer. Encoded state features enter its cross-attention layers from the side as keys and values; the updated action tokens produce action scores.</desc>
<defs>
<style>
.bg{fill:#f6f8fc}.card{fill:#fff;stroke:#d8e1ed;stroke-width:2}.title{font:700 31px 'DejaVu Sans',sans-serif;fill:#14243e}.sub{font:16px 'DejaVu Sans',sans-serif;fill:#52637b}.head{font:700 21px 'DejaVu Sans',sans-serif;fill:#172946}.body{font:700 17px 'DejaVu Sans',sans-serif;fill:#203551}.small{font:15px 'DejaVu Sans',sans-serif;fill:#53657d}.mono{font:16px 'DejaVu Sans Mono',monospace;fill:#203551}.tag{font:700 14px 'DejaVu Sans',sans-serif;fill:#285d92}.blue{fill:#e7f2ff;stroke:#a8cbf2;stroke-width:1.5}.amber{fill:#fff3dc;stroke:#f0d198;stroke-width:1.5}.purple{fill:#eee9ff;stroke:#cabaf8;stroke-width:1.5}.mint{fill:#e5f7ee;stroke:#a8dfc2;stroke-width:1.5}.line{fill:none;stroke:#62758e;stroke-width:2.5;marker-end:url(#arrow)}.side{fill:none;stroke:#2b79c0;stroke-width:3;marker-end:url(#bluearrow)}.skip{fill:none;stroke:#d69229;stroke-width:2.5;marker-end:url(#arrow)}
</style>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#62758e"/></marker>
<marker id="bluearrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#2b79c0"/></marker>
</defs>
<rect class="bg" width="1440" height="810"/>
<text class="title" x="40" y="53">Possible decision model architectures</text>
<text class="sub" x="40" y="82">Decision model architectures mainly differ in how state and action are connected and interact within the network.</text>

<rect class="card" x="40" y="116" width="440" height="650" rx="18"/>
<text class="head" x="65" y="155">1  Next-token probabilities</text>
<text class="small" x="65" y="183">Qwen3.5-9B · no decision training</text>
<rect class="blue" x="65" y="218" width="390" height="95" rx="12"/>
<text class="mono" x="84" y="247">State: S</text>
<text class="mono" x="84" y="274">A. action 1   B. action 2</text>
<text class="mono" x="84" y="300">Answer:</text>
<path class="line" d="M260 313 V346"/>
<rect class="purple" x="65" y="351" width="390" height="76" rx="12"/>
<text class="body" x="84" y="380">Language model</text>
<text class="small" x="84" y="406">Reads state and all actions together</text>
<path class="line" d="M260 427 V459"/>
<rect class="amber" x="65" y="464" width="390" height="74" rx="12"/>
<text class="body" x="84" y="493">Next-token log probabilities</text>
<text class="small" x="84" y="519">p(A), p(B), … at the answer position</text>
<path class="line" d="M260 538 V571"/>
<rect class="mint" x="65" y="576" width="390" height="72" rx="12"/>
<text class="body" x="84" y="605">Align by action; choose maximum</text>
<text class="small" x="84" y="630">Rotate option positions in our evaluation</text>
<text class="tag" x="65" y="711">N prompt orders in our evaluation</text>
<text class="small" x="65" y="735">No new scoring head</text>

<rect class="card" x="500" y="116" width="440" height="650" rx="18"/>
<text class="head" x="525" y="155">2  Contrastive similarity</text>
<text class="small" x="525" y="183">CLM · separate state/action encoders</text>
<rect class="blue" x="525" y="218" width="170" height="60" rx="12"/>
<text class="mono" x="551" y="254">State S</text>
<rect class="amber" x="745" y="218" width="170" height="60" rx="12"/>
<text class="mono" x="764" y="254">A₁…Aₙ</text>
<path class="line" d="M610 278 V319"/>
<path class="line" d="M830 278 V319"/>
<rect class="blue" x="525" y="324" width="170" height="86" rx="12"/>
<text class="body" x="545" y="356">State encoder</text>
<text class="small" x="545" y="384">vector zₛ</text>
<rect class="amber" x="745" y="324" width="170" height="86" rx="12"/>
<text class="body" x="763" y="356">Action encoder</text>
<text class="small" x="763" y="384">vectors zₐ₁…zₐₙ</text>
<path class="line" d="M610 410 V453 H703 V464"/>
<path class="line" d="M830 410 V453 H737 V464"/>
<rect class="purple" x="555" y="470" width="330" height="78" rx="12"/>
<text class="body" x="579" y="500">Cosine / dot product</text>
<text class="small" x="579" y="527">Compare zₛ with each zₐ</text>
<path class="line" d="M720 548 V581"/>
<rect class="mint" x="555" y="586" width="330" height="62" rx="12"/>
<text class="body" x="579" y="624">Choose top similarity</text>
<text class="tag" x="525" y="711">Action vectors can be cached</text>
<text class="small" x="525" y="735">State and action meet at vector comparison</text>

<rect class="card" x="960" y="116" width="440" height="650" rx="18"/>
<text class="head" x="985" y="155">3  Action-token Transformer</text>
<text class="small" x="985" y="183">State enters through cross-attention</text>
<rect class="blue" x="985" y="218" width="151" height="65" rx="12"/>
<text class="mono" x="1008" y="256">State S</text>
<rect class="amber" x="1170" y="218" width="205" height="65" rx="12"/>
<text class="body" x="1185" y="246">Action tokens</text>
<text class="small" x="1185" y="271">Input: A₁, A₂, …, Aₙ</text>
<path class="line" d="M1272 283 V334"/>
<path class="side" d="M1060 283 V331"/>
<rect class="blue" x="985" y="337" width="151" height="74" rx="12"/>
<text class="body" x="998" y="366">State encoder</text>
<text class="small" x="998" y="393">encode once</text>
<path class="side" d="M1060 411 V453"/>
<rect class="blue" x="985" y="459" width="151" height="63" rx="12"/>
<text class="body" x="998" y="487">State features</text>
<text class="small" x="998" y="509">keys K, values V</text>
<rect x="1170" y="340" width="205" height="310" rx="14" fill="#f8f5ff" stroke="#aa92df" stroke-width="2"/>
<text class="body" x="1185" y="368">Transformer × L</text>
<path class="line" d="M1272 377 V396"/>
<rect class="purple" x="1186" y="402" width="173" height="61" rx="9"/>
<text class="body" x="1196" y="426">Cross-attention</text>
<text class="small" x="1196" y="451">Q: action tokens</text>
<path class="side" d="M1136 489 H1153 V437 H1182"/>
<path class="skip" d="M1272 385 H1366 V492 H1296"/>
<path class="line" d="M1272 463 V472"/>
<circle cx="1272" cy="492" r="16" fill="#fff" stroke="#8e9db0" stroke-width="2"/>
<text class="body" x="1265" y="498">+</text>
<text class="small" x="1190" y="499">norm</text>
<path class="line" d="M1272 508 V535"/>
<rect class="purple" x="1186" y="541" width="173" height="49" rx="9"/>
<text class="body" x="1200" y="572">Feed-forward</text>
<path class="line" d="M1272 590 V609"/>
<text class="small" x="1194" y="634">Residual + norm</text>
<path class="line" d="M1272 650 V685"/>
<rect class="mint" x="1170" y="691" width="205" height="51" rx="12"/>
<text class="body" x="1185" y="722">Per-action scores</text>
<text class="small" x="985" y="714">Proposed design;</text>
<text class="small" x="985" y="737">requires training</text>
</svg>
